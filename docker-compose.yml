# yaml-language-server: $schema=.vscode/compose-spec.json
services:
  mysql:
    image: mysql:8.0
    container_name: test-pipeline-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_pipeline
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock:
    build: ./mock_server
    container_name: test-pipeline-mock
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  app:
    build: ./backend
    container_name: test-pipeline-app
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/test_pipeline?charset=utf8mb4
      BASE_URL: http://mock:5000
      IN_DOCKER: "true"
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      DINGTALK_WEBHOOK: ${DINGTALK_WEBHOOK}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/allure-report:/app/allure-report
      - ./backend/allure-results:/app/allure-results
    depends_on:
      mysql:
        condition: service_healthy
      mock:
        condition: service_started

volumes:
  mysql_data: