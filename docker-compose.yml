# yaml-language-server: $schema=.vscode/compose-spec.json
services:
  mysql:
    image: mysql:8.0
    container_name: test-pipeline-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_pipeline
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # redis:
